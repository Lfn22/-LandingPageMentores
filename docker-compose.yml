services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: lpm
      MARIADB_USER: lpm
      MARIADB_PASSWORD: lpm_dev_pass
      MARIADB_ROOT_PASSWORD: root_dev_pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${LPM_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html
      - ./app:/var/www/app
      - ./docker:/var/www/docker:ro
    environment:
      APP_CONFIG_FILE: /var/www/docker/config.docker.php
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
